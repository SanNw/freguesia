name: Docker Build

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
    branches: [main]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Build Worker image
        run: docker build -t freguesia-worker:${{ github.sha }} ./apps/worker

      - name: Scan image
        uses: aquasecurity/trivy-action@master
        with:
          image-ref: freguesia-worker:${{ github.sha }}
          severity: CRITICAL,HIGH
          exit-code: 1
