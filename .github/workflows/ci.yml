name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  lint-and-test:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_USER: freguesia
          POSTGRES_PASSWORD: test
          POSTGRES_DB: freguesia_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U freguesia"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: apps/worker/package-lock.json

      - name: Install dependencies
        working-directory: apps/worker
        run: npm ci

      - name: Format check
        working-directory: apps/worker
        run: npm run format:check

      - name: Lint
        working-directory: apps/worker
        run: npm run lint

      - name: Typecheck
        working-directory: apps/worker
        run: npm run typecheck

      - name: Unit tests
        working-directory: apps/worker
        run: npm run test
        env:
          DATABASE_URL: postgresql://freguesia:test@localhost:5432/freguesia_test
          APP_ENV: test
          NODE_ENV: test
          WORKER_SERVICE_TOKEN: ci-test-token-not-real
          TELEGRAM_BOT_TOKEN: test-bot-token
          TELEGRAM_APPROVAL_CHAT_ID: -1001
          TELEGRAM_PUBLIC_CHANNEL_ID: -1002
          WORKER_PUBLIC_BASE_URL: http://localhost:3001
          WORKER_INTERNAL_BASE_URL: http://localhost:3001

      - name: Build
        working-directory: apps/worker
        run: npm run build

  validate-workflows:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Validate workflow JSONs
        run: |
          for f in n8n/workflows/*.json; do
            echo "Validating $f"
            node -e "JSON.parse(require('fs').readFileSync('$f','utf-8'));"
          done

  validate-compose:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Validate docker-compose
        run: docker compose config --quiet
