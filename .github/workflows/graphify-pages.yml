name: Publish Graphify map

on:
  push:
    branches: [main]
    paths:
      - "graphify-out/**"
      - ".github/workflows/graphify-pages.yml"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/configure-pages@v5
        with:
          enablement: true
      - name: Prepare site
        shell: bash
        run: |
          mkdir _site
          cp graphify-out/GRAPH_TREE.html _site/index.html
          cp graphify-out/graph.html graphify-out/graph.json _site/
          touch _site/.nojekyll
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
