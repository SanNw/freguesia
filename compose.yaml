name: freguesia

services:
  postgres:
    image: postgres:17-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-freguesia}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-change-me}
      POSTGRES_DB: ${POSTGRES_DB:-freguesia}
      N8N_DB_NAME: ${DB_POSTGRESDB_DATABASE:-n8n}
      N8N_DB_USER: ${DB_POSTGRESDB_USER:-n8n}
      N8N_DB_PASSWORD: ${DB_POSTGRESDB_PASSWORD:-change-me}
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ${FREGUESIA_RUNTIME_ROOT:-.}/database/schema.sql:/docker-entrypoint-initdb.d/01-schema.sql:ro
      - ${FREGUESIA_RUNTIME_ROOT:-.}/database/init-n8n-db.sh:/docker-entrypoint-initdb.d/02-init-n8n-db.sh:ro
    networks: [internal]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-freguesia}"]
      interval: 10s
      timeout: 5s
      retries: 5

  n8n:
    image: docker.n8n.io/n8nio/n8n:${N8N_IMAGE_VERSION:-2.30.5}
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    env_file:
      - ./.env
    volumes:
      - n8n_data:/home/node/.n8n
      - ${FREGUESIA_RUNTIME_ROOT:-.}/n8n/workflows:/home/node/.n8n/workflows
    environment:
      N8N_WORKFLOW_FOLDER: /home/node/.n8n/workflows
      N8N_BLOCK_ENV_ACCESS_IN_NODE: "false"
      N8N_PROXY_HOPS: "1"
      N8N_DIAGNOSTICS_ENABLED: "false"
      N8N_VERSION_NOTIFICATIONS_ENABLED: "false"
      N8N_TEMPLATES_ENABLED: "false"
      N8N_PERSONALIZATION_ENABLED: "false"
      N8N_HIRING_BANNER_ENABLED: "false"
      N8N_DISABLED_MODULES: "mcp-registry"
      EXECUTIONS_DATA_PRUNE: "true"
      EXECUTIONS_DATA_MAX_AGE: ${N8N_EXECUTIONS_DATA_MAX_AGE:-168}
    networks: [internal]
    healthcheck:
      test: ["CMD", "wget", "-q", "-T", "5", "-O", "/dev/null", "http://127.0.0.1:5678/healthz"]
      interval: 30s
      timeout: 10s
      retries: 3

  worker:
    image: ${FREGUESIA_WORKER_IMAGE:-freguesia-worker}
    build:
      context: ${FREGUESIA_WORKER_BUILD_CONTEXT:-./apps/worker}
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    env_file:
      - ./.env
    environment:
      NODE_ENV: ${NODE_ENV:-development}
      APP_ENV: ${APP_ENV:-development}
      APP_VERSION: ${APP_VERSION:-0.1.0}
      TZ: ${TZ:-America/Sao_Paulo}
      LOG_LEVEL: ${LOG_LEVEL:-info}
      LOG_PRETTY: ${LOG_PRETTY:-true}
      WORKER_HOST: ${WORKER_HOST:-0.0.0.0}
      WORKER_PORT: ${WORKER_PORT:-3001}
      WORKER_SERVICE_TOKEN: ${WORKER_SERVICE_TOKEN}
      SITE_SYNC_ENABLED: ${SITE_SYNC_ENABLED:-false}
      PERFORMANCE_REPORTS_ENABLED: ${PERFORMANCE_REPORTS_ENABLED:-false}
      SHOPPING_ASSISTANT_ENABLED: ${SHOPPING_ASSISTANT_ENABLED:-false}
      TELEGRAM_BOT_USERNAME: ${TELEGRAM_BOT_USERNAME:-}
      TELEGRAM_REPORT_CHAT_ID: ${TELEGRAM_REPORT_CHAT_ID:-}
      SITE_API_BASE_URL: ${SITE_API_BASE_URL:-https://freguesia-web.pages.dev}
      SITE_SYNC_TIMEOUT_MS: ${SITE_SYNC_TIMEOUT_MS:-10000}
      DATABASE_URL: ${DATABASE_URL}
      TELEGRAM_BOT_TOKEN: ${TELEGRAM_BOT_TOKEN}
      TELEGRAM_APPROVAL_CHAT_ID: ${TELEGRAM_APPROVAL_CHAT_ID}
      TELEGRAM_PUBLIC_CHANNEL_ID: ${TELEGRAM_PUBLIC_CHANNEL_ID}
      TELEGRAM_PUBLIC_CHANNEL_USERNAME: ${TELEGRAM_PUBLIC_CHANNEL_USERNAME}
      TELEGRAM_ADMIN_USER_IDS: ${TELEGRAM_ADMIN_USER_IDS}
      TELEGRAM_WEBHOOK_SECRET: ${TELEGRAM_WEBHOOK_SECRET}
      TELEGRAM_PARSE_MODE: ${TELEGRAM_PARSE_MODE:-HTML}
      TELEGRAM_MESSAGE_FOOTER: ${TELEGRAM_MESSAGE_FOOTER}
      PLAYWRIGHT_BROWSER: ${PLAYWRIGHT_BROWSER:-chromium}
      PLAYWRIGHT_HEADLESS: ${PLAYWRIGHT_HEADLESS:-true}
      PLAYWRIGHT_NAVIGATION_TIMEOUT_MS: ${PLAYWRIGHT_NAVIGATION_TIMEOUT_MS:-45000}
      PLAYWRIGHT_ACTION_TIMEOUT_MS: ${PLAYWRIGHT_ACTION_TIMEOUT_MS:-15000}
      PLAYWRIGHT_JOB_TIMEOUT_MS: ${PLAYWRIGHT_JOB_TIMEOUT_MS:-90000}
      PLAYWRIGHT_MAX_CONCURRENCY: ${PLAYWRIGHT_MAX_CONCURRENCY:-1}
      PLAYWRIGHT_AUTH_DIR: ${PLAYWRIGHT_AUTH_DIR:-/app/data/auth}
      PLAYWRIGHT_SCREENSHOT_DIR: ${PLAYWRIGHT_SCREENSHOT_DIR:-/app/data/screenshots}
      PLAYWRIGHT_TRACE_DIR: ${PLAYWRIGHT_TRACE_DIR:-/app/data/traces}
      AWIN_FEED_PATH: ${AWIN_FEED_PATH:-/app/data/awin/datafeed_3040995.csv}
    volumes:
      - browser_auth:/app/data/auth
      - worker_traces:/app/data/traces
      - worker_screenshots:/app/data/screenshots
      - ${FREGUESIA_RUNTIME_ROOT:-.}/data/awin:/app/data/awin:ro
    ports:
      - "127.0.0.1:3001:3001"
    networks: [internal]
    security_opt:
      - no-new-privileges:true
    healthcheck:
      test: ["CMD-SHELL", "node -e \"require('http').get('http://127.0.0.1:3001/health',r=>{process.exit(r.statusCode===200?0:1)}).on('error',()=>process.exit(1))\""]
      interval: 15s
      timeout: 5s
      retries: 3

  caddy:
    image: caddy:2-alpine
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ${FREGUESIA_RUNTIME_ROOT:-.}/infra/Caddyfile.dev:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    networks: [internal]
    depends_on:
      - n8n
      - worker

networks:
  internal:
    driver: bridge

volumes:
  postgres_data:
  n8n_data:
  browser_auth:
  worker_traces:
  worker_screenshots:
  caddy_data:
  caddy_config:
